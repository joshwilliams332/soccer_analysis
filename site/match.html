<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mingus FC · Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap" id="page"><div class="card empty" style="margin-top:18px">Loading…</div></main>
<script src="assets/common.js"></script>
<script>
MFC.header("index.html");
MFC.footer();
const page = document.getElementById("page");
const { esc, num, pct, us, form } = MFC;

/* One comparison row. better: "high" | "low" | null (no color). */
function row(label, hv, av, better, fmt = (x) => num(x), sub = null) {
  let hc = "", ac = "";
  if (better && hv != null && av != null && hv !== av) {
    const hWins = better === "high" ? hv > av : hv < av;
    hc = hWins ? "better" : "worse"; ac = hWins ? "worse" : "better";
  }
  const s = (x) => (sub ? `<small>${sub(x)}</small>` : "");
  return `<tr><td>${label}</td><td class="v ${hc}">${fmt(hv)}${s("h")}</td><td class="v ${ac}">${fmt(av)}${s("a")}</td></tr>`;
}

function keyPlayers(players, teamId) {
  const rows = players.filter((p) => p.team === teamId && p.min >= 180).sort((a, b) => b.xgi - a.xgi).slice(0, 5);
  return `<div class="tbl-wrap"><table>
    <tr><th class="l">Player</th><th>Min</th><th>G</th><th>A</th><th>xG</th><th>xA</th></tr>
    ${rows.map((p) => `<tr><td class="l"><b>${esc(p.name)}</b> ${p.pens === 1 ? '<span class="pill">PEN</span>' : ""}
      ${p.status !== "a" ? `<span class="pill doubt">${p.chance}%</span>` : ""}</td>
      <td>${p.min}</td><td>${p.g}</td><td>${p.a}</td><td>${num(p.xg, 1)}</td><td>${num(p.xa, 1)}</td></tr>`).join("")}
  </table></div>`;
}

const STATUS = { d: "Doubtful", i: "Injured", s: "Suspended", u: "Unavailable", n: "Not available" };
function outList(rows) {
  if (!rows || !rows.length) return `<div class="muted small">Nobody flagged.</div>`;
  return `<ul class="plist watch">${rows.map((o) => `<li><div class="who"><b>${esc(o.name)}</b>
    <span class="small muted">${o.pos} · ${esc(o.news || STATUS[o.status] || "")}</span></div>
    <div class="p">${o.chance}%<span>to play</span></div><div></div></li>`).join("")}</ul>`;
}

function recent(team, matches) {
  const rows = matches.filter((m) => m.home === team.id || m.away === team.id).slice(-5).reverse();
  return `<div class="card"><h3>${esc(team.name)} · last ${rows.length}</h3><div class="tbl-wrap"><table>
    <tr><th class="l">Opponent</th><th>Score</th><th>xG</th><th>xGA</th></tr>
    ${rows.map((m) => {
      const home = m.home === team.id, gf = home ? m.hg : m.ag, ga = home ? m.ag : m.hg;
      const xf = home ? m.hxg : m.axg, xa = home ? m.axg : m.hxg;
      const res = gf > ga ? "W" : gf === ga ? "D" : "L";
      return `<tr><td class="l">${home ? "" : "@ "}${esc(home ? m.away_short : m.home_short)}</td>
        <td><span class="res ${res}">${res}</span> ${gf}-${ga}</td>
        <td class="${xf > xa ? "better" : xf < xa ? "worse" : ""}">${num(xf)}</td><td>${num(xa)}</td></tr>`;
    }).join("")}</table></div></div>`;
}

Promise.all([MFC.load("schedule"), MFC.load("teams"), MFC.load("matches"), MFC.load("players")])
  .then(([sched, teamRows, matches, players]) => {
  const id = Number(MFC.param("id"));
  const teams = Object.fromEntries(teamRows.map((t) => [t.id, t]));
  const fx = sched.find((f) => f.id === id);
  if (!fx) {
    const m = matches.find((x) => x.id === id);
    page.innerHTML = m
      ? `<div class="card" style="margin-top:18px"><h3>Full time</h3>
          <p>${esc(teams[m.home].name)} <b>${m.hg} – ${m.ag}</b> ${esc(teams[m.away].name)}</p>
          <p class="muted">xG ${num(m.hxg)} – ${num(m.axg)}</p><a href="index.html">Upcoming matches</a></div>`
      : `<div class="card empty" style="margin-top:18px">That match isn't in the next two gameweeks. <a href="index.html">See matches</a></div>`;
    return;
  }
  const h = teams[fx.home], a = teams[fx.away], o = fx.odds;
  document.title = `${h.short} v ${a.short} · Mingus FC`;
  page.innerHTML = `<div class="m-hero">
      <div class="m-head"><div class="small muted">GAMEWEEK ${fx.gw} · ${MFC.day(fx.kickoff)} · ${MFC.time(fx.kickoff)}</div></div>
      <div class="m-teams">
        <div class="m-team"><h1 class="${h.name.length > 10 ? "long" : ""}">${esc(h.name)}</h1><div class="form">${form(h.form)}</div>
          <div class="small muted rec">${MFC.ord(h.pos)} · ${h.pts} pts</div></div>
        <div class="m-score" style="font-size:18px">vs</div>
        <div class="m-team" style="text-align:right"><h1 class="${a.name.length > 10 ? "long" : ""}">${esc(a.name)}</h1><div class="form">${form(a.form)}</div>
          <div class="small muted rec">${MFC.ord(a.pos)} · ${a.pts} pts</div></div>
      </div>
      ${o ? `<div class="odds3" style="margin-top:14px;flex-wrap:wrap">
          <span>${us(o.us.h)}<small>${esc(h.short)} ${pct(o.implied.h)}</small></span>
          <span>${us(o.us.d)}<small>Draw ${pct(o.implied.d)}</small></span>
          <span>${us(o.us.a)}<small>${esc(a.short)} ${pct(o.implied.a)}</small></span>
          ${o.us.o25 != null ? `<span>${us(o.us.o25)}<small>Over 2.5</small></span><span>${us(o.us.u25)}<small>Under 2.5</small></span>` : ""}
        </div><div class="small muted" style="text-align:center;margin-top:6px">Average bookmaker odds via football-data.co.uk</div>`
        : `<div class="small muted" style="text-align:center;margin-top:12px">Odds not out yet</div>`}
    </div>

    <h2>Head to head</h2>
    <div class="tbl-wrap"><table class="cmp">
      <tr><th></th><th style="text-align:center">${MFC.team(h.short, h.short)}</th><th style="text-align:center">${MFC.team(a.short, a.short)}</th></tr>
      ${row("League position", h.pos, a.pos, "low", MFC.ord)}
      ${row("Points", h.pts, a.pts, "high", (x) => x)}
      ${row("Won · drawn · lost", h.w, a.w, null, () => "", (s) => (s === "h" ? `${h.w}-${h.d}-${h.l}` : `${a.w}-${a.d}-${a.l}`))}
      ${row("Goals scored a game", h.gf_pg, a.gf_pg, "high")}
      ${row("Goals allowed a game", h.ga_pg, a.ga_pg, "low")}
      ${row("xG a game", h.xgf_pg, a.xgf_pg, "high")}
      ${row("xG allowed a game", h.xga_pg, a.xga_pg, "low")}
      ${row("xG difference a game", h.xgd_pg, a.xgd_pg, "high")}
      ${row("xG a game, last 6", h.last6.xgf_pg, a.last6.xgf_pg, "high")}
      ${row("xG allowed, last 6", h.last6.xga_pg, a.last6.xga_pg, "low")}
      ${row(`xG a game (${esc(h.short)} home, ${esc(a.short)} away)`, h.home.xgf_pg, a.away.xgf_pg, "high")}
      ${row(`xG allowed (${esc(h.short)} home, ${esc(a.short)} away)`, h.home.xga_pg, a.away.xga_pg, "low")}
      ${row("Points minus expected points", h.pts_minus_xpts, a.pts_minus_xpts, null, (x) => (x > 0 ? "+" : "") + num(x, 1))}
    </table></div>
    <p class="small muted">Green = better of the two, red = worse. Expected points: what each match's chances would earn on
      average; a big plus means results have run ahead of the chances.</p>

    <h2>Key players</h2>
    <div class="grid two"><div class="card"><h3>${esc(h.name)}</h3>${keyPlayers(players, h.id)}</div>
      <div class="card"><h3>${esc(a.name)}</h3>${keyPlayers(players, a.id)}</div></div>

    <h2>Injuries and doubts</h2>
    <div class="grid two"><div class="card"><h3>${esc(h.name)}</h3>${outList(fx.out.home)}</div>
      <div class="card"><h3>${esc(a.name)}</h3>${outList(fx.out.away)}</div></div>

    <h2>Recent results</h2>
    <div class="grid two">${recent(h, matches)}${recent(a, matches)}</div>
    <p class="small"><a href="compare.html?a=${h.id}&b=${a.id}">Compare these teams in full</a></p>`;
}).catch((e) => MFC.fail(page, e));
</script>
</body>
</html>
