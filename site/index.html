<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mingus FC · Premier League matches, odds and xG</title>
<meta name="description" content="Premier League fixtures with free bookmaker odds, last week's results with xG, and player of the week.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head"><div><h1 id="title">Matches</h1></div><div class="seg" id="gws"></div></div>
  <div class="card" style="padding:4px 12px"><ul class="fxl" id="list"><li class="empty">Loading…</li></ul></div>
  <p class="small muted" id="oddsnote" style="margin:6px 2px 0"></p>

  <h2 id="rtitle">Last week's results</h2>
  <div class="card" style="padding:8px 10px"><table class="rs" id="results"></table>
    <p class="small muted" style="margin:6px 2px 2px">Top number goals, bottom xG (expected goals). <b>xG says</b>: how
      likely that result was from the chances both sides created. Green = the chances pointed this way, red = a
      surprise.</p></div>

  <h2 id="ptitle">Player of the week</h2>
  <div id="potw"></div>
</main>
<script src="assets/common.js"></script>
<script>
MFC.header("index.html");
MFC.footer();
const { esc, num, pct, us, team } = MFC;
const el = (id) => document.getElementById(id);

function oddsCell(o) {
  if (!o) return `<div class="small muted" style="margin-top:4px">Odds not out yet</div>`;
  return `<div class="odds3"><span>${us(o.us.h)}<small>${pct(o.implied.h)}</small></span><span>${us(o.us.d)}<small>draw</small></span><span>${us(o.us.a)}<small>${pct(o.implied.a)}</small></span></div>`;
}

function fixtureRow(fx, teams) {
  const h = teams[fx.home], a = teams[fx.away];
  const sub = (t) => `${MFC.ord(t.pos)} · ${t.pts} pts · ${t.form.slice(-5).join("")}`;
  return `<li><a href="match.html?id=${fx.id}">
    <div class="side">${team(h.short, h.name)}<span class="sub2">${sub(h)}</span></div>
    <div class="mid">${MFC.time(fx.kickoff)}${oddsCell(fx.odds)}</div>
    <div class="side away"><span class="tm r">${MFC.dot(a.short)}${esc(a.name)}</span><span class="sub2">${sub(a)}</span></div></a></li>`;
}

function cmpClass(x, y) { return x > y ? "up" : x < y ? "down" : "even"; }

function resultRow(m, teams) {
  const h = teams[m.home], a = teams[m.away];
  const c = m.result_chance;
  // Color against the likeliest result: draws are rarely the likeliest, so a fixed cut-off would make every draw "lucky".
  const ratio = c == null || !m.likeliest ? null : c / m.likeliest;
  const cc = ratio == null ? "even" : ratio >= 0.85 ? "up" : ratio < 0.45 ? "down" : "even";
  return `<tr>
    <td class="t h">${esc(h.name)}</td>
    <td class="box"><b class="${cmpClass(m.hg, m.ag)}">${m.hg}</b><span class="${cmpClass(m.hxg, m.axg)}">${num(m.hxg)}</span></td>
    <td class="lbl"><span>G</span><span>xG</span></td>
    <td class="box"><b class="${cmpClass(m.ag, m.hg)}">${m.ag}</b><span class="${cmpClass(m.axg, m.hxg)}">${num(m.axg)}</span></td>
    <td class="t a">${esc(a.name)}</td>
    <td class="ch ${cc}">${c == null ? "–" : pct(c)}</td></tr>`;
}

Promise.all([MFC.load("schedule"), MFC.load("teams"), MFC.load("gameweek")]).then(([sched, teamRows, gwk]) => {
  const teams = Object.fromEntries(teamRows.map((t) => [t.id, t]));
  const gws = [...new Set(sched.map((f) => f.gw))].sort((x, y) => x - y);
  let gw = Number(MFC.param("gw")) || gws[0];
  function render() {
    el("gws").innerHTML = gws.map((g) => `<button class="${g === gw ? "on" : ""}" data-gw="${g}">GW ${g}</button>`).join("");
    el("title").textContent = gws.length ? `Gameweek ${gw}` : "Matches";
    let html = "", last = "";
    for (const fx of sched.filter((f) => f.gw === gw)) {
      const k = MFC.dayKey(fx.kickoff);
      if (k !== last) { html += `<li class="day" style="margin:12px 4px 2px">${MFC.day(fx.kickoff)}</li>`; last = k; }
      html += fixtureRow(fx, teams);
    }
    el("list").innerHTML = html || `<li class="empty">No upcoming matches.</li>`;
    const any = sched.some((f) => f.gw === gw && f.odds);
    el("oddsnote").textContent = any ? "Odds: average across bookmakers (US format), with the chance they imply. Via football-data.co.uk, updated a couple of times a week." : "";
  }
  el("gws").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    gw = Number(b.dataset.gw); history.replaceState(null, "", `?gw=${gw}`); render();
  });
  render();

  if (gwk.results) {
    el("rtitle").textContent = `Gameweek ${gwk.gw} results`;
    el("results").innerHTML = `<tr><td></td><td></td><td></td><td></td><td></td><td class="small muted" style="text-align:center;font-weight:800">xG says</td></tr>`
      + gwk.results.map((m) => resultRow(m, teams)).join("");
  }
  if (gwk.top && gwk.top.length) {
    const [p, ...rest] = gwk.top;
    el("ptitle").textContent = `Player of the week · GW ${gwk.gw}`;
    el("potw").innerHTML = `<div class="potw"><div><div class="k">Player of the week</div><div class="n">${esc(p.name)}</div>
      <div class="small" style="color:#C9D1CD">${MFC.dot(p.team_short)} ${esc(p.team_short)} · ${p.pos} · ${p.g} G · ${p.a} A · ${num(p.xg)} xG · ${num(p.xa)} xA</div></div>
      <div class="pts">${p.pts}<small>FPL PTS</small></div></div>
      <div class="card" style="margin-top:10px;padding:4px 12px"><ul class="plist">${rest.map((x, i) => `<li>
        <div class="n">${i + 2}</div><div class="who"><b>${esc(x.name)}</b><span class="small muted">${esc(x.team_short)} · ${x.pos} · ${x.g} G · ${x.a} A · ${num(x.xg)} xG</span></div>
        <div class="big"><b style="font-size:17px">${x.pts}</b> <span class="small muted">pts</span></div></li>`).join("")}</ul></div>`;
  }
}).catch((e) => MFC.fail(el("list"), e));
</script>
</body>
</html>
