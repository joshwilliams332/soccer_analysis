name: Build data and site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * *"   # midday UK: injury news before the day's games
    - cron: "41 23 * * *"   # after the evening games
    - cron: "47 17 * * 0,6" # weekend: after the early and 3 PM games
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every player history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-data-${{ github.event_name == 'pull_request' && 'preview' || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Check out the data branch
        env:
          BR: ${{ github.event_name == 'pull_request' && 'data-preview' || 'data' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DATA_BRANCH=$BR" >> "$GITHUB_ENV"
          mkdir out && cd out
          git init -q -b "$BR"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin "$BR"; then git checkout -q -B "$BR" FETCH_HEAD; else echo "new data branch"; fi

      - name: Fetch FPL data
        run: python scripts/fpl.py --out out ${{ inputs.full && '--full' || '' }}

      - name: Fetch free odds (football-data.co.uk; optional)
        run: python scripts/odds.py --out out

      - name: Build
        run: python scripts/build_data.py --out out

      - name: Save to the data branch
        run: |
          cd out
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin "$DATA_BRANCH"

  deploy:
    # Publishes site/ plus the fresh build/ files to GitHub Pages (main, schedule and Run workflow only).
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the latest data
        run: |
          git fetch -q --depth 1 origin data
          mkdir -p site/data
          git --work-tree=site/data checkout FETCH_HEAD -- build
          # Public files only: the model's projections and accuracy (fixtures.json, accuracy.json) stay off the site.
          for f in teams players matches schedule gameweek meta; do mv "site/data/build/$f.json" site/data/; done
          rm -rf site/data/build
          git reset -q
          ls -la site/data

      - name: Cache-bust the shared files
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i "s#assets/style.css\"#assets/style.css?v=$v\"#; s#assets/common.js\"#assets/common.js?v=$v\"#" site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
